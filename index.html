<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kado — Your Health Records</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface2: #f2ede8;
    --border: #e8e2da;
    --text: #1a1612;
    --text2: #6b6158;
    --text3: #a89e94;
    --accent: #c8603a;
    --accent-light: #f5ede8;
    --green: #2d6a4f;
    --green-light: #e8f4ee;
    --amber: #b5651d;
    --amber-light: #fdf0e0;
    --blue: #2563a8;
    --blue-light: #e8f0fb;
    --red: #c0392b;
    --red-light: #fde8e6;
    --sans: 'DM Sans', sans-serif;
    --serif: 'DM Serif Display', serif;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--text); }

  /* ── SCREEN SYSTEM ── */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; background: var(--bg); overflow: hidden; }
  .screen.active { display: flex; }

  /* ── LOGIN ── */
  #screen-login {
    background: var(--text);
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
  }
  .login-logo {
    font-family: var(--serif);
    font-size: 48px;
    color: #fff;
    margin-bottom: 8px;
    letter-spacing: -1px;
  }
  .login-tagline {
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 56px;
    font-weight: 400;
  }
  .login-box {
    width: 100%;
    max-width: 360px;
  }
  .login-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 12px;
  }
  .phone-row {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .phone-prefix {
    padding: 18px 16px;
    font-size: 16px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    border-right: 1px solid rgba(255,255,255,0.1);
    white-space: nowrap;
  }
  #phone-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 18px 16px;
    font-size: 18px;
    font-weight: 500;
    color: #fff;
    font-family: var(--sans);
    letter-spacing: 1px;
  }
  #phone-input::placeholder { color: rgba(255,255,255,0.25); letter-spacing: 0; }
  #login-btn {
    width: 100%;
    padding: 18px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    font-family: var(--sans);
    transition: opacity 0.2s, transform 0.1s;
  }
  #login-btn:active { transform: scale(0.98); opacity: 0.9; }
  #login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #login-error {
    display: none;
    margin-top: 12px;
    padding: 12px 16px;
    background: rgba(192,57,43,0.2);
    border: 1px solid rgba(192,57,43,0.3);
    border-radius: 10px;
    font-size: 13px;
    color: #ff8070;
    line-height: 1.5;
  }
  .login-note {
    margin-top: 40px;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    text-align: center;
    line-height: 1.7;
  }

  /* ── APP SHELL ── */
  #screen-app {
    background: var(--bg);
  }
  .app-header {
    padding: 56px 24px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .app-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .app-logo {
    font-family: var(--serif);
    font-size: 28px;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .avatar-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    font-family: var(--sans);
  }
  .tab-bar {
    display: flex;
    gap: 0;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text3);
    font-family: var(--sans);
    position: relative;
    transition: color 0.2s;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ── TAB CONTENT ── */
  .tab-content { display: none; flex: 1; overflow-y: auto; padding: 20px 16px 100px; }
  .tab-content.active { display: block; }

  /* ── SECTION LABEL ── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
    margin-top: 24px;
    padding: 0 4px;
  }
  .section-label:first-child { margin-top: 4px; }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .card-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.4;
  }
  .card-date {
    font-size: 11px;
    color: var(--text3);
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* ── TAGS ── */
  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .tag-normal { background: var(--green-light); color: var(--green); }
  .tag-abnormal { background: var(--red-light); color: var(--red); }
  .tag-borderline { background: var(--amber-light); color: var(--amber); }
  .tag-pending { background: var(--blue-light); color: var(--blue); }

  /* ── STATS ROW ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .stat-value {
    font-family: var(--serif);
    font-size: 28px;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text3);
    font-weight: 500;
    line-height: 1.3;
  }

  /* ── KADO CARD ── */
  .kado-card {
    background: var(--surface);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .kado-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .kado-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .kado-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
  }
  .kado-level {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .kado-level-1 { background: var(--green-light); color: var(--green); }
  .kado-level-2 { background: var(--amber-light); color: var(--amber); }
  .kado-level-3 { background: var(--red-light); color: var(--red); }
  .kado-summary {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .kado-biomarkers {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .bio-chip {
    font-size: 12px;
    padding: 4px 10px;
    background: var(--surface2);
    border-radius: 8px;
    color: var(--text2);
    font-weight: 500;
  }
  .bio-chip.abnormal { background: var(--red-light); color: var(--red); }
  .bio-chip.borderline { background: var(--amber-light); color: var(--amber); }

  /* ── COVERAGE ── */
  .coverage-ring-wrap {
    background: var(--surface);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .ring-chart {
    flex-shrink: 0;
  }
  .ring-info { flex: 1; }
  .ring-score {
    font-family: var(--serif);
    font-size: 40px;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }
  .ring-label {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .progress-row {
    margin-bottom: 8px;
  }
  .progress-label-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .progress-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
  }
  .progress-count {
    font-size: 12px;
    color: var(--text3);
  }
  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  /* ── BIOMARKER LIST ── */
  .bio-row {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .bio-row:last-child { border-bottom: none; }
  .bio-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .bio-dot.normal { background: var(--green); }
  .bio-dot.abnormal { background: var(--red); }
  .bio-dot.borderline { background: var(--amber); }
  .bio-dot.missing { background: var(--text3); }
  .bio-bio-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .bio-value {
    font-size: 13px;
    color: var(--text2);
    text-align: right;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  .empty-sub {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
  }
  .whatsapp-btn {
    margin-top: 20px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px;
    background: #25d366;
    border-radius: 14px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    font-family: var(--sans);
  }

  /* ── LOADING ── */
  .loading-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--text);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="screen-login" class="screen active">
  <div class="login-logo">Kado</div>
  <div class="login-tagline">Your health records, always with you</div>
  <div class="login-box">
    <div class="login-label">Your WhatsApp number</div>
    <div class="phone-row">
      <div class="phone-prefix">+91</div>
      <input type="tel" id="phone-input" placeholder="98765 43210" maxlength="10" inputmode="numeric">
    </div>
    <button id="login-btn" onclick="handleLogin()">View my records</button>
    <div id="login-error"></div>
  </div>
  <div class="login-note">
    Your records are private and encrypted.<br>
    Only you can access them.
  </div>
</div>

<!-- APP SCREEN -->
<div id="screen-app" class="screen">
  <div class="app-header">
    <div class="app-header-top">
      <div class="app-logo">Kado</div>
      <button class="avatar-btn" id="avatar-btn" onclick="handleLogout()">H</button>
    </div>
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('records')">Records</button>
      <button class="tab" onclick="switchTab('kados')">Kados</button>
      <button class="tab" onclick="switchTab('coverage')">Coverage</button>
    </div>
  </div>

  <!-- RECORDS TAB -->
  <div id="tab-records" class="tab-content active">
    <div id="records-content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- KADOS TAB -->
  <div id="tab-kados" class="tab-content">
    <div id="kados-content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- COVERAGE TAB -->
  <div id="tab-coverage" class="tab-content">
    <div id="coverage-content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'https://api.kado.care';
let currentUser = null;
let appData = {};

// ── API ──
async function apiFetch(path) {
  const res = await fetch(API + path);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || err.detail || 'API error');
  }
  return res.json();
}

// ── LOGIN ──
async function handleLogin() {
  const input = document.getElementById('phone-input').value.trim().replace(/\s/g, '');
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  err.style.display = 'none';

  if (input.length < 10) {
    err.textContent = 'Please enter your 10-digit WhatsApp number.';
    err.style.display = 'block';
    return;
  }

  const phone = '+91' + input;
  btn.disabled = true;
  btn.textContent = 'Checking...';

  try {
    // KEY FIX: encode + as %2B so the server receives it correctly
    const encodedPhone = phone.replace('+', '%2B');
    const data = await apiFetch(`/user?phone=${encodedPhone}`);
    currentUser = data;
    localStorage.setItem('kado_user', JSON.stringify(data));

    // Set avatar initials
    const initial = data.name ? data.name[0].toUpperCase() : phone.slice(-2);
    document.getElementById('avatar-btn').textContent = initial;

    btn.disabled = false;
    btn.textContent = 'View my records';
    showScreen('app');
    await loadApp();
  } catch (e) {
    err.textContent = 'Number not found. Please send a report on WhatsApp first, or check your number.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'View my records';
  }
}

document.getElementById('phone-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});

function handleLogout() {
  if (confirm('Log out?')) {
    localStorage.removeItem('kado_user');
    currentUser = null;
    appData = {};
    showScreen('login');
  }
}

// ── SCREEN ──
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

// ── TABS ──
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ── LOAD APP DATA ──
async function loadApp() {
  // Load all three in parallel
  await Promise.all([
    loadRecords(),
    loadKados(),
    loadCoverage()
  ]);
}

// ── RECORDS ──
async function loadRecords() {
  const el = document.getElementById('records-content');
  try {
    const [reports, biomarkers, kados] = await Promise.all([
      apiFetch(`/records?user_id=${currentUser.id}`),
      apiFetch(`/biomarkers?user_id=${currentUser.id}`),
      apiFetch(`/kados?user_id=${currentUser.id}`)
    ]);
    appData.reports = reports || [];
    appData.biomarkers = biomarkers || [];
    appData.kados = kados || [];
    renderRecords(el);
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load records</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

function renderRecords(el) {
  const { reports, biomarkers, kados } = appData;
  const totalReports = reports.length;
  const activeKados = kados.length;
  const abnormalCount = biomarkers.filter(b => b.status === 'abnormal' || b.status === 'borderline').length;

  let html = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value">${totalReports}</div>
        <div class="stat-label">Reports uploaded</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${activeKados}</div>
        <div class="stat-label">Active Kados</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:${abnormalCount > 0 ? 'var(--red)' : 'var(--green)'}">${abnormalCount}</div>
        <div class="stat-label">Need attention</div>
      </div>
    </div>
  `;

  if (reports.length === 0) {
    html += `
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">No reports yet</div>
        <div class="empty-sub">Send your lab reports on WhatsApp and Kado will organise them here automatically.</div>
        <a class="whatsapp-btn" href="https://wa.me/917827368258" target="_blank">

          Send a report

    `;
  } else {
    html += `<div class="section-label">Recent Reports</div>`;

      const date = formatDate(r.created_at || r.report_date);
      const icon = getReportIcon(r.report_type || r.type);
      const statusTag = r.status ? `<span class="tag tag-${r.status}">${r.status}</span>` : '';

        <div class="card">
          <div class="card-row">

              <div class="card-sub" style="margin-top:4px">${statusTag}</div>
            </div>

          </div>

      `;
    });
  }

  el.innerHTML = html;
}

// ── KADOS ──
async function loadKados() {
  const el = document.getElementById('kados-content');
  try {
    const kados = await apiFetch(`/kados?user_id=${currentUser.id}`);
    appData.kados = kados || [];
    renderKados(el);
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load Kados</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

function renderKados(el) {
  const kados = appData.kados;

  if (!kados || kados.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎴</div>
        <div class="empty-title">No Kado cards yet</div>
        <div class="empty-sub">Once Kado analyses your reports, it will create health cards summarising each condition or finding.</div>
      </div>
    `;
    return;
  }

  let html = `<div class="section-label">Your Health Cards</div>`;
  kados.forEach(k => {
    const level = k.severity_level || k.level || 1;
    const levelLabel = level === 1 ? 'Mild' : level === 2 ? 'Moderate' : 'Needs attention';
    const icon = getKadoIcon(k.condition_name || k.name);
    const biomarkers = k.biomarkers || k.related_biomarkers || [];
    const bioHtml = Array.isArray(biomarkers) ? biomarkers.map(b => {
      const cls = b.status === 'abnormal' ? 'abnormal' : b.status === 'borderline' ? 'borderline' : '';
      return `<span class="bio-chip ${cls}">${b.name || b}</span>`;
    }).join('') : '';

    html += `
      <div class="kado-card">
        <div class="kado-header">
          <div class="kado-icon" style="background:var(--surface2)">${icon}</div>
          <div class="kado-name">${k.condition_name || k.name || 'Health Condition'}</div>
          <span class="kado-level kado-level-${level}">${levelLabel}</span>
        </div>
        <div class="kado-summary">${k.summary || k.description || 'Your doctor has flagged this for monitoring.'}</div>
        ${bioHtml ? `<div class="kado-biomarkers">${bioHtml}</div>` : ''}
      </div>
    `;
  });

  el.innerHTML = html;
}

// ── COVERAGE ──
async function loadCoverage() {
  const el = document.getElementById('coverage-content');
  try {
    const [biomarkers, library] = await Promise.all([
      apiFetch(`/biomarkers?user_id=${currentUser.id}`),
      apiFetch(`/library`).catch(() => [])
    ]);
    appData.biomarkers = biomarkers || [];
    appData.library = library || [];
    renderCoverage(el);
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load coverage</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

function renderCoverage(el) {
  const biomarkers = appData.biomarkers || [];
  const library = appData.library || [];

  const essLib = library.filter(b => b.level === 'essential').map(b => b.name.toLowerCase());
  const advLib = library.filter(b => b.level === 'advanced').map(b => b.name.toLowerCase());
  const trackedNames = [...new Set(biomarkers.map(b => b.name.toLowerCase()))];

  const essCovered = essLib.filter(n => trackedNames.includes(n)).length;
  const advCovered = advLib.filter(n => trackedNames.includes(n)).length;
  const totalLib = essLib.length + advLib.length;
  const totalCovered = trackedNames.length;
  const coveragePct = totalLib > 0 ? Math.round((totalCovered / totalLib) * 100) : (totalCovered > 0 ? 100 : 0);

  // Group biomarkers by status
  const abnormal = biomarkers.filter(b => b.status === 'abnormal');
  const borderline = biomarkers.filter(b => b.status === 'borderline');
  const normal = biomarkers.filter(b => b.status === 'normal');

  const ringPct = Math.min(coveragePct, 100);
  const circumference = 2 * Math.PI * 40;
  const dashOffset = circumference - (ringPct / 100) * circumference;

  let html = `
    <div class="coverage-ring-wrap">
      <svg class="ring-chart" width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="var(--surface2)" stroke-width="10"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="var(--accent)" stroke-width="10"
          stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"
          stroke-linecap="round" transform="rotate(-90 50 50)"/>
        <text x="50" y="54" text-anchor="middle" font-family="DM Serif Display,serif" font-size="20" fill="var(--text)">${ringPct}%</text>
      </svg>
      <div class="ring-info">
        <div class="ring-score">${totalCovered}</div>
        <div class="ring-label">biomarkers tracked across ${totalCovered > 0 ? 'your reports' : 'no reports yet'}</div>
        ${essLib.length > 0 ? `
        <div class="progress-row">
          <div class="progress-label-row">
            <span class="progress-name">Essential</span>
            <span class="progress-count">${essCovered}/${essLib.length}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${essLib.length ? Math.round(essCovered/essLib.length*100) : 0}%;background:var(--green)"></div></div>
        </div>
        <div class="progress-row">
          <div class="progress-label-row">
            <span class="progress-name">Advanced</span>
            <span class="progress-count">${advCovered}/${advLib.length}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${advLib.length ? Math.round(advCovered/advLib.length*100) : 0}%;background:var(--blue)"></div></div>
        </div>
        ` : ''}
      </div>
    </div>
  `;

  if (biomarkers.length === 0) {
    html += `
      <div class="empty-state">
        <div class="empty-icon">🔬</div>
        <div class="empty-title">No biomarkers tracked yet</div>
        <div class="empty-sub">Send a lab report on WhatsApp and Kado will extract and track your biomarkers automatically.</div>
      </div>
    `;
  } else {
    if (abnormal.length > 0) {
      html += `<div class="section-label">Needs attention</div><div class="card">`;
      abnormal.forEach(b => {
        html += `
          <div class="bio-row">
            <div class="bio-dot abnormal"></div>
            <div class="bio-bio-name">${b.name}</div>
            <div class="bio-value" style="color:var(--red)">${formatBioValue(b)}</div>
          </div>
        `;
      });
      html += `</div>`;
    }

    if (borderline.length > 0) {
      html += `<div class="section-label">Borderline</div><div class="card">`;
      borderline.forEach(b => {
        html += `
          <div class="bio-row">
            <div class="bio-dot borderline"></div>
            <div class="bio-bio-name">${b.name}</div>
            <div class="bio-value" style="color:var(--amber)">${formatBioValue(b)}</div>
          </div>
        `;
      });
      html += `</div>`;
    }

    if (normal.length > 0) {
      html += `<div class="section-label">Normal</div><div class="card">`;
      normal.forEach(b => {
        html += `
          <div class="bio-row">
            <div class="bio-dot normal"></div>
            <div class="bio-bio-name">${b.name}</div>
            <div class="bio-value">${formatBioValue(b)}</div>
          </div>
        `;
      });
      html += `</div>`;
    }
  }

  el.innerHTML = html;
}

// ── HELPERS ──
function formatDate(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: '2-digit' });
}

function formatBioValue(b) {
  if (b.value && b.unit) return `${b.value} ${b.unit}`;
  if (b.value) return b.value;
  return '';
}

function getReportIcon(type) {
  if (!type) return '📋';
  const t = type.toLowerCase();
  if (t.includes('blood') || t.includes('cbc') || t.includes('haem')) return '🩸';
  if (t.includes('urine') || t.includes('urea')) return '🧪';
  if (t.includes('thyroid') || t.includes('tsh')) return '🦋';
  if (t.includes('lipid') || t.includes('cholesterol')) return '❤️';
  if (t.includes('liver') || t.includes('lft')) return '🫁';
  if (t.includes('kidney') || t.includes('creat') || t.includes('kft')) return '🫘';
  if (t.includes('sugar') || t.includes('glucose') || t.includes('hba1c')) return '🍬';
  if (t.includes('xray') || t.includes('scan') || t.includes('mri') || t.includes('ct')) return '📡';
  return '📋';
}

function getKadoIcon(name) {
  if (!name) return '🎴';
  const n = name.toLowerCase();
  if (n.includes('anaemia') || n.includes('anemia') || n.includes('iron')) return '🩸';
  if (n.includes('thyroid') || n.includes('hypothyroid') || n.includes('hyperthyroid')) return '🦋';
  if (n.includes('diabetes') || n.includes('sugar') || n.includes('glucose')) return '🍬';
  if (n.includes('cholesterol') || n.includes('lipid') || n.includes('triglyceride')) return '❤️';
  if (n.includes('liver') || n.includes('hepatit')) return '🫁';
  if (n.includes('kidney') || n.includes('renal')) return '🫘';
  if (n.includes('vitamin') || n.includes('deficien')) return '💊';
  if (n.includes('pressure') || n.includes('hypert')) return '💓';
  return '🎴';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── INIT ──
window.addEventListener('load', async () => {
  const saved = localStorage.getItem('kado_user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      const initial = currentUser.name ? currentUser.name[0].toUpperCase() : '?';
      document.getElementById('avatar-btn').textContent = initial;
      showScreen('app');
      await loadApp();
    } catch(e) {
      localStorage.removeItem('kado_user');
    }
  }
});
</script>
