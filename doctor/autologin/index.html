<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kado Care — Signing in</title>
    <script src="/env.js" onerror="window.__KADO_API__ = undefined"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f5f7f5;
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .msg {
        color: #4a4a4a;
        font-size: 15px;
        text-align: center;
      }
      .msg.error {
        color: #c0392b;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 14px;
        border: 3px solid #dfe6df;
        border-top-color: #2d6be4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="spinner" id="spinner"></div>
      <div class="msg" id="msg">Signing in…</div>
    </div>
    <script>
      const AUTOLOGIN_PHONE = "+919654160898";
      const AUTOLOGIN_PASSCODE = "111111";
      const API = window.__KADO_API__ || "https://api.kado.care";

      function fail(text) {
        document.getElementById("spinner").style.display = "none";
        const el = document.getElementById("msg");
        el.textContent = text;
        el.classList.add("error");
      }

      (async () => {
        try {
          const res = await fetch(API + "/doctor/auth/verify-passcode", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              phone_number: AUTOLOGIN_PHONE,
              passcode: AUTOLOGIN_PASSCODE,
            }),
          });
          const data = await res.json();
          if (data.token && data.doctor) {
            localStorage.setItem("kado_doctor_token", data.token);
            localStorage.setItem("kado_doctor", JSON.stringify(data.doctor));
            window.location.href = "/";
            return;
          }
          fail(data.error || "Autologin failed.");
        } catch (e) {
          fail("Something went wrong.");
        }
      })();
    </script>
  </body>
</html>
